    <text x="100" y="62">s₁</text>
    <text x="286" y="62">s₁'</text>
    <text x="100" y="160">s₂</text>
    <text x="286" y="160">s₂'</text>
    <text x="193" y="44">&#956;</text>
    <text x="193" y="146">&#956;</text>
    <text x="86" y="110" text-anchor="end" font-size="13" fill="#5a6b80">r</text>
    <text x="300" y="110" text-anchor="start" font-size="13" fill="#5a6b80">r</text>
  </g>
</svg>
