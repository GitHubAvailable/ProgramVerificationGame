<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" width="400" height="210" role="img" aria-label="模拟关系示意图：实现的一步由规约的一步应答，两个状态始终保持关联。">
  <title>模拟关系示意图：实现的一步由规约的一步应答，两个状态始终保持关联。</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3b63"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-size="13" fill="#5a6b80" text-anchor="start">
    <text x="16" y="34">实现</text>
    <text x="16" y="176">规约</text>
  </g>
  <g fill="none" stroke="#1f3b63" stroke-width="2">
