<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 160" width="360" height="160" role="img" aria-label="奇偶自动机：两个状态，偶与奇；读入 1 切换状态，读入 0 保持不变。">
  <title>奇偶自动机：两个状态，偶与奇；读入 1 切换状态，读入 0 保持不变。</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3b63"/>
    </marker>
  </defs>
  <g fill="none" stroke="#1f3b63" stroke-width="2">
    <circle cx="100" cy="80" r="32" fill="#eef3fa"/>
    <circle cx="280" cy="80" r="32" fill="#eef3fa"/>
    <path d="M 40 80 L 64 80" marker-end="url(#a)"/>
    <path d="M 130 66 Q 190 26 250 66" marker-end="url(#a)"/>
    <path d="M 250 94 Q 190 134 130 94" marker-end="url(#a)"/>
    <path d="M 80 54 C 66 14 134 14 120 54" marker-end="url(#a)"/>
    <path d="M 260 54 C 246 14 314 14 300 54" marker-end="url(#a)"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#1f3b63" text-anchor="middle">
    <text x="100" y="86" font-size="17">偶</text>
    <text x="280" y="86" font-size="17">奇</text>
    <text x="190" y="36">1</text>
    <text x="190" y="128">1</text>
    <text x="100" y="18">0</text>
    <text x="280" y="18">0</text>
    <text x="38" y="72" text-anchor="end" font-size="13">开始</text>
  </g>
</svg>
